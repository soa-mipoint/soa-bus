global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: mipoint
    env: local

scrape_configs:
  - job_name: customer-service
    static_configs:
      - targets: ["customer-service:8000"]
    metrics_path: /metrics

  - job_name: space-catalog-service
    static_configs:
      - targets: ["space-catalog-service:8000"]
    metrics_path: /metrics

  - job_name: booking-service
    static_configs:
      - targets: ["booking-service:8000"]
    metrics_path: /metrics

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:8000"]
    metrics_path: /metrics

  - job_name: kong
    static_configs:
      - targets: ["kong:8888"]
    metrics_path: /metrics

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
    metrics_path: /metrics
