version: "3.9"

services:
  # ─── Infrastructure ───────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mipoint
      POSTGRES_PASSWORD: mipoint_secret
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"    # 5433 on host → avoid conflict with local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mipoint"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"    # 6380 on host → avoid conflict with local Redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: mipoint
      RABBITMQ_DEFAULT_PASS: mipoint_secret
    ports:
      - "5672:5672"
      - "15672:15672"    # Management UI → http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  kong:
    build: ./gateway
    volumes:
      - ./gateway/kong.yml:/etc/kong/kong.yml:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8888"
      KONG_LOG_LEVEL: info
      KONG_PLUGINS: bundled
    ports:
      - "8000:8000"    # API Gateway (main entry point)
      - "8888:8888"    # Kong Admin API
    depends_on:
      customer-service:
        condition: service_started
      space-catalog-service:
        condition: service_started
      booking-service:
        condition: service_started

  # ─── Business Services ────────────────────────────────────────────────────

  customer-service:
    build: ./services/customer-service
    environment:
      DATABASE_URL: postgresql+asyncpg://mipoint:mipoint_secret@postgres:5432/customers_db
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://mipoint:mipoint_secret@rabbitmq:5672/
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretkey-change-in-production-min-32-chars}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
      JWT_ISSUER: mipoint-key
    ports:
      - "8001:8000"    # Direct access for dev/testing
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  space-catalog-service:
    build: ./services/space-catalog-service
    environment:
      DATABASE_URL: postgresql+asyncpg://mipoint:mipoint_secret@postgres:5432/catalog_db
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://mipoint:mipoint_secret@rabbitmq:5672/
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretkey-change-in-production-min-32-chars}
      JWT_ALGORITHM: HS256
      JWT_ISSUER: mipoint-key
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  booking-service:
    build: ./services/booking-service
    environment:
      DATABASE_URL: postgresql+asyncpg://mipoint:mipoint_secret@postgres:5432/bookings_db
      REDIS_URL: redis://redis:6379/2
      RABBITMQ_URL: amqp://mipoint:mipoint_secret@rabbitmq:5672/
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretkey-change-in-production-min-32-chars}
      JWT_ALGORITHM: HS256
      JWT_ISSUER: mipoint-key
      SPACE_CATALOG_URL: http://space-catalog-service:8000
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    environment:
      RABBITMQ_URL: amqp://mipoint:mipoint_secret@rabbitmq:5672/
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    ports:
      - "8004:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
